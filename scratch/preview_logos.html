<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Logo Preview Test</title>
  <style>
    body {
      background-color: #0B111E;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 40px;
    }
    .brand-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
    }
    .brand-card {
      width: 120px;
      height: 120px;
      background: #151F32;
      border: 1px solid #1E293B;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      box-sizing: border-box;
      gap: 8px;
    }
    .emblem-wrapper {
      width: 100%;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-title {
      font-size: 13px;
      font-weight: 700;
      color: #F1F5F9;
    }
    .brand-count {
      font-size: 11px;
      color: #64748B;
    }
  </style>
</head>
<body>
  <h2 style="text-align: center; margin-bottom: 24px;">Aperçu des Logos Officiels</h2>
  <div class="brand-grid">
    <!-- Audi Option A: 3D Chrome cropped -->
    <div class="brand-card">
      <div class="emblem-wrapper">
        <div style="width: 68px; height: 26px; overflow: hidden; display: flex; align-items: flex-start; justify-content: center;">
          <img src="../../public/brands/audi_official.png" style="width: 68px; height: auto; margin-top: -1px; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.7));" alt="Audi">
        </div>
      </div>
      <div class="brand-title">Audi (3D)</div>
      <div class="brand-count">4 نماذج</div>
    </div>

    <!-- Audi Option B: SVG rings with silver gradient -->
    <div class="brand-card">
      <div class="emblem-wrapper">
        <img src="../../public/brands/audi_wiki.svg" style="width: 58px; height: auto; filter: invert(1) drop-shadow(0 2px 4px rgba(0,0,0,0.5));" alt="Audi">
      </div>
      <div class="brand-title">Audi (Vector)</div>
      <div class="brand-count">4 نماذج</div>
    </div>

    <!-- Mercedes-Benz Official 3D Star -->
    <div class="brand-card">
      <div class="emblem-wrapper">
        <img src="../../public/brands/mb_star_only.png" style="width: 44px; height: 44px; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));" alt="Mercedes-Benz">
      </div>
      <div class="brand-title">Mercedes-Benz</div>
      <div class="brand-count">3 نماذج</div>
    </div>

    <!-- BMW Official Bavarian Roundel -->
    <div class="brand-card">
      <div class="emblem-wrapper">
        <img src="../../public/brands/bmw_official.png" style="width: 44px; height: 44px; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));" alt="BMW">
      </div>
      <div class="brand-title">BMW</div>
      <div class="brand-count">4 نماذج</div>
    </div>

    <!-- Porsche Official Crest -->
    <div class="brand-card">
      <div class="emblem-wrapper">
        <img src="../../public/brands/porsche_official.png" style="width: 36px; height: 48px; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));" alt="Porsche">
      </div>
      <div class="brand-title">Porsche</div>
      <div class="brand-count">3 نماذج</div>
    </div>

    <!-- Volkswagen Official 3D Chrome -->
    <div class="brand-card">
      <div class="emblem-wrapper">
        <img src="../../public/brands/vw_2012_chrome.png" style="width: 44px; height: 44px; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));" alt="Volkswagen">
      </div>
      <div class="brand-title">Volkswagen</div>
      <div class="brand-count">3 نماذج</div>
    </div>

    <!-- Range Rover Official 3D Oval -->
    <div class="brand-card">
      <div class="emblem-wrapper">
        <img src="../../public/brands/landrover_official.png" style="width: 64px; height: 36px; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));" alt="Range Rover">
      </div>
      <div class="brand-title">Range Rover</div>
      <div class="brand-count">2 نماذج</div>
    </div>

    <!-- Jetour Option A: Official vector in white -->
    <div class="brand-card">
      <div class="emblem-wrapper">
        <img src="../../public/brands/jetour_official_logo.svg" style="width: 72px; height: auto; filter: invert(1) drop-shadow(0 2px 4px rgba(0,0,0,0.5));" alt="Jetour">
      </div>
      <div class="brand-title">Jetour</div>
      <div class="brand-count">2 نماذج</div>
    </div>

    <!-- Ferrari Official Modena Shield -->
    <div class="brand-card">
      <div class="emblem-wrapper">
        <img src="../../public/brands/ferrari_official.png" style="width: 34px; height: 48px; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));" alt="Ferrari">
      </div>
      <div class="brand-title">Ferrari</div>
      <div class="brand-count">2 نماذج</div>
    </div>
  </div>
</body>
</html>
